name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caesura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/caesura
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/caesura
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long-example
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_MODE: "true"
      ADMIN_EMAIL: owner@thecaesura.local
      ADMIN_PASSWORD: ci-owner-password-1234
      IP_HASH_SALT: ci-ip-hash-salt-minimum-32-characters-long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Security audit
        run: corepack pnpm audit --prod

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Apply database migrations
        run: corepack pnpm db:migrate

      - name: Seed baseline data
        run: corepack pnpm db:seed

      - name: Run test suite
        run: corepack pnpm test

      - name: Build Next.js application
        run: corepack pnpm build

